<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextBridge</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="logotextbridge.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --text: #111;
      --muted: #8e8e93;
      --overlay: rgba(0,0,0,0.4);
      --sidebar: #f7f7f8;
    }

    .dark {
      --bg: #0f0f10;
      --text: #f5f5f7;
      --muted: #7a7a80;
      --overlay: rgba(0,0,0,0.6);
      --sidebar: #161617;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
      height: 100vh;
      overflow: hidden;
    }

    #app { display: flex; height: 100vh; transition: filter 0.25s ease; }
    #app.locked { filter: blur(12px); pointer-events: none; user-select: none; }

    aside {
      width: 170px;
      background: var(--sidebar);
      border-right: 1px solid rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      padding: 18px 10px;
      gap: 4px;
    }
    .dark aside { border-right-color: rgba(255,255,255,0.08); }

    .sb-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      padding: 4px 8px 12px;
      letter-spacing: 0.4px;
    }

    .tabs { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }

    .tab {
      text-align: left;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab:hover { background: rgba(0,0,0,0.05); }
    .dark .tab:hover { background: rgba(255,255,255,0.06); }
    .tab.active { background: var(--text); color: var(--bg); }

    .new-room {
      margin-top: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      border: 1px dashed var(--muted);
      cursor: pointer;
      transition: 0.15s;
    }
    .new-room:hover { color: var(--text); border-color: var(--text); }

    main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      font-size: 13px;
      color: var(--muted);
    }

    .title {
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    .controls {
      display: flex;
      gap: 16px;
    }

    button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    button:hover {
      color: var(--text);
    }

    textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 50px 28px;
      font-size: 19px;
      font-weight: 300;
      line-height: 1.7;
      background: transparent;
      color: var(--text);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 12px;
    }

    #qrOverlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s ease;
      z-index: 50;
    }

    #qrOverlay.active {
      opacity: 1;
      visibility: visible;
    }

    #qrBox {
      background: var(--bg);
      padding: 28px;
      border-radius: 18px;
      transform: scale(0.9);
      transition: 0.25s ease;
    }

    #qrOverlay.active #qrBox {
      transform: scale(1);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      transition: 0.3s ease;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
    }

    #pinGate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
    }

    #pinGate.hidden { display: none; }

    .pin-card {
      text-align: center;
      padding: 40px;
    }

    .pin-card h1 {
      font-weight: 500;
      margin: 0 0 8px;
    }

    .pin-card p {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 24px;
    }

    .pin-input {
      font-size: 28px;
      letter-spacing: 12px;
      text-align: center;
      width: 220px;
      padding: 12px;
      border: 1px solid var(--muted);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      outline: none;
    }

    .pin-input.shake { animation: shake 0.35s; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .pin-error {
      color: #e53935;
      font-size: 12px;
      margin-top: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>

<div id="pinGate">
  <div class="pin-card">
    <h1>TextBridge</h1>
    <p>Enter 6-digit access PIN</p>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
    <div id="pinError" class="pin-error"></div>
  </div>
</div>

<div id="app" class="locked">
  <aside>
    <div class="sb-title">TextBridge</div>
    <div id="roomTabs" class="tabs"></div>
    <button id="newRoomBtn" class="new-room">+ New</button>
  </aside>
  <main>
    <header>
      <div class="title">TextBridge</div>
      <div class="controls">
        <button onclick="copyText()">Copy</button>
        <button onclick="clearText()">Clear</button>
        <button onclick="toggleTheme()">Theme</button>
        <button id="qrBtn">QR</button>
      </div>
    </header>

    <textarea id="textInput" placeholder="Start typing..."></textarea>

    <footer>
      Auto-saved locally • Private • Installable
    </footer>
  </main>
</div>

<div id="qrOverlay">
  <div id="qrBox"></div>
</div>

<div id="toast" class="toast">Copied</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const SITE_PIN = "080801";

  const firebaseConfig = {
      apiKey: "AIzaSyCUq6hxZ3PmXF76xm6t_WVQsn5uhOD-z48",
      authDomain: "textbridge-2697f.firebaseapp.com",
      databaseURL: "https://textbridge-2697f-default-rtdb.firebaseio.com",
      projectId: "textbridge-2697f",
      storageBucket: "textbridge-2697f.firebasestorage.app",
      messagingSenderId: "260570991041",
      appId: "1:260570991041:web:afc8fbd02efe84ec208740"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const textarea = document.getElementById("textInput");
  const qrOverlay = document.getElementById("qrOverlay");
  const qrBox = document.getElementById("qrBox");
  const qrBtn = document.getElementById("qrBtn");
  const toast = document.getElementById("toast");
  const appEl = document.getElementById("app");
  const pinGate = document.getElementById("pinGate");
  const pinInput = document.getElementById("pinInput");
  const pinError = document.getElementById("pinError");
  const roomTabs = document.getElementById("roomTabs");
  const newRoomBtn = document.getElementById("newRoomBtn");

  if (localStorage.getItem("tb-theme") === "dark") {
    document.body.classList.add("dark");
  }

  let unlocked = sessionStorage.getItem("tb-unlocked") === "1";
  function unlock() {
    unlocked = true;
    sessionStorage.setItem("tb-unlocked", "1");
    pinGate.classList.add("hidden");
    appEl.classList.remove("locked");
    initRooms();
  }
  function lock() {
    unlocked = false;
    sessionStorage.removeItem("tb-unlocked");
    pinGate.classList.remove("hidden");
    appEl.classList.add("locked");
    pinInput.value = "";
    pinError.textContent = "";
    if (currentUnsub) { currentUnsub(); currentUnsub = null; }
  }
  pinInput.addEventListener("input", () => {
    pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 6);
    pinError.textContent = "";
    if (pinInput.value.length === 6) {
      if (pinInput.value === SITE_PIN) unlock();
      else {
        pinError.textContent = "Wrong PIN";
        pinInput.classList.add("shake");
        setTimeout(() => pinInput.classList.remove("shake"), 350);
        pinInput.value = "";
      }
    }
  });
  if (unlocked) { pinGate.classList.add("hidden"); appEl.classList.remove("locked"); }

  let rooms = JSON.parse(localStorage.getItem("tb-rooms") || '["main"]');
  if (!Array.isArray(rooms) || !rooms.length) rooms = ["main"];
  let currentRoom = localStorage.getItem("tb-room") || rooms[0];
  if (!rooms.includes(currentRoom)) currentRoom = rooms[0];
  let roomRef = null;
  let currentUnsub = null;
  let writeTimer = null;

  function renderTabs() {
    roomTabs.innerHTML = "";
    rooms.forEach(r => {
      const b = document.createElement("button");
      b.className = "tab" + (r === currentRoom ? " active" : "");
      b.textContent = r;
      b.addEventListener("click", () => { if (r !== currentRoom) { currentRoom = r; renderTabs(); openRoom(r); } });
      roomTabs.appendChild(b);
    });
  }

  function openRoom(id) {
    if (currentUnsub) { currentUnsub(); currentUnsub = null; }
    currentRoom = id;
    localStorage.setItem("tb-room", id);
    roomRef = ref(db, `rooms/${id}`);
    textarea.value = "";
    const local = localStorage.getItem(`tb-data-${id}`);
    if (local) textarea.value = local;
    currentUnsub = onValue(roomRef, (snapshot) => {
      const data = snapshot.val();
      if (data !== null && document.activeElement !== textarea) {
        textarea.value = data;
        localStorage.setItem(`tb-data-${id}`, data);
      }
    }, (err) => console.error(err));
    renderTabs();
  }

  function saveRoomList() { localStorage.setItem("tb-rooms", JSON.stringify(rooms)); }

  newRoomBtn.addEventListener("click", () => {
    const name = prompt("New clipboard name:");
    if (!name) return;
    const id = name.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "-").slice(0, 30) || `room-${Date.now()}`;
    if (rooms.includes(id)) { alert("Already exists"); return; }
    rooms.push(id);
    saveRoomList();
    openRoom(id);
  });

  textarea.addEventListener("input", () => {
    const text = textarea.value;
    localStorage.setItem(`tb-data-${currentRoom}`, text);
    clearTimeout(writeTimer);
    writeTimer = setTimeout(() => { if (roomRef) set(roomRef, text); }, 200);
  });
  textarea.addEventListener("blur", () => { if (roomRef) set(roomRef, textarea.value); });
  window.addEventListener("beforeunload", () => { if (roomRef) set(roomRef, textarea.value); });

  function initRooms() { renderTabs(); openRoom(currentRoom); }
  if (unlocked) initRooms();

  window.copyText = () => {
    navigator.clipboard.writeText(textarea.value);
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1200);
  };

  window.clearText = () => {
    textarea.value = "";
    localStorage.removeItem(`tb-data-${currentRoom}`);
    if (roomRef) set(roomRef, "");
  };

  window.toggleTheme = () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("tb-theme",
      document.body.classList.contains("dark") ? "dark" : "light"
    );
  };

  qrBtn.addEventListener("click", () => {
    qrBox.innerHTML = "";
    new QRCode(qrBox, {
      text: window.location.href,
      width: 180,
      height: 180
    });
    qrOverlay.classList.add("active");
  });

  qrOverlay.addEventListener("click", (e) => {
    if (e.target === qrOverlay) {
      qrOverlay.classList.remove("active");
      qrBox.innerHTML = "";
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      qrOverlay.classList.remove("active");
      qrBox.innerHTML = "";
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
